<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Control Panel</title>
    <style>
        body {
            background-color: #030435;
            color: #89CFF0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid #333;
            text-align: center;
            width: 350px;
        }
        input[type="file"] { display: none; }
        .custom-file-upload {
            border: 2px dashed #89CFF0;
            display: inline-block;
            padding: 30px;
            cursor: pointer;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            font-weight: 500;
            width: 80%;
        }
        .custom-file-upload:hover { 
            background: rgba(137, 207, 240, 0.1); 
            border-color: #b2e2f7;
        }
        button {
            background: #89CFF0;
            color: #121212;
            border: none;
            padding: 15px 25px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: transform 0.2s;
        }
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .status { 
            margin-top: 1.2rem; 
            font-size: 0.85rem; 
            color: #89CFF0; 
            letter-spacing: 1px;
            font-weight: bold;
        }
        .spinner {
            display: none; 
            width: 40px;
            height: 40px;
            margin: 20px auto;
            border: 4px solid rgba(137, 207, 240, 0.1);
            border-left-color: #89CFF0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
            <label class="custom-file-upload" id="dropZone">
                <input type="file" id="fileInput" name="file" accept="image/*" required>
                <span id="fileName">CHOOSE AN IMAGE </span>
            </label>
            <div id="loader" class="spinner"></div>
            <button type="submit" id="submitBtn">START DRAWING</button>
        </form>
        <div class="status" id="statusText">STATUS: READY TO PRINT</div>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameText = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const statusText = document.getElementById('statusText');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileNameText.innerText = "FILE: " + this.files[0].name;
                statusText.innerText = "STATUS: IMAGE LOADED";
                statusText.style.color = "#89CFF0";
            }
        });

        uploadForm.addEventListener('submit', function() {
            submitBtn.disabled = true; 
            submitBtn.innerText = "PROCESSING...";
            loader.style.display = "block"; 
            statusText.innerText = "STATUS: GENERATING G-CODE...";
            statusText.style.color = "#FFD700"; 
        });
    </script>

</body>
</html>
